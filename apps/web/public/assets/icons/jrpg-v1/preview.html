<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>guildloom · JRPG icons 96</title><link rel="stylesheet" href="icons.css"><style>:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#070b14;color:#e2e8f0}*{box-sizing:border-box}body{max-width:1400px;margin:auto;padding:32px 20px}h1{letter-spacing:-1px}p{color:#a4b2c6;line-height:1.7}.tools{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#070b14ee;padding:12px 0;z-index:1}input,select,button{background:#152337;border:1px solid #344963;border-radius:5px;color:#e2e8f0;padding:10px;font:inherit}input{flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px}.card{background:#0d1526;border:1px solid #27354a;border-radius:7px;text-align:center;padding:16px 4px;min-height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.card b{font-size:12px}.card code{font-size:10px;color:#a4b2c6}.light .card{background:#ded5bf;color:#243037}.light .card code{color:#465263}a{color:#80c9bf;font-size:11px}h2{margin-top:32px;font-size:19px}img{image-rendering:pixelated}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.hidden{display:none}footer{margin:32px 0;color:#a4b2c6;font-size:12px}</style><h1>guildloom · JRPG 도트 아이콘</h1><p>96종 · 32×32px / 64×64px · 공통 32색 팔레트 · 투명 배경<br>현재 화면과 설계 명세의 아이콘 용도를 포함합니다. 각 항목에서 개별 PNG를 열거나 저장할 수 있습니다.</p><div class="tools"><input id="q" type="search" placeholder="이름·파일명 검색" aria-label="아이콘 검색"><select id="category" aria-label="분류"><option value="">전체 분류</option></select><select id="size" aria-label="표시 크기"><option value="32">32px · 실제 크기</option><option value="64">64px · 2배 확대</option></select><button id="bg">밝은 배경</button></div><div id="content"></div><footer><a href="manifest.json">매니페스트</a> · <a href="icons.css">CSS 스프라이트</a> · <a href="sprite.png">전체 시트</a> · <a href="sprite@2x.png">전체 시트 2배</a></footer><script>const data={"records":[{"id":"guild","label":"길드","group":"core"},{"id":"quest","label":"퀘스트","group":"core"},{"id":"party","label":"파티","group":"core"},{"id":"adventurer","label":"모험가","group":"core"},{"id":"familiar","label":"소환수","group":"core"},{"id":"board","label":"게시판","group":"core"},{"id":"dungeon","label":"던전 진행","group":"core"},{"id":"boss","label":"보스전","group":"core"},{"id":"cleared","label":"클리어","group":"core"},{"id":"ledger","label":"원장","group":"core"},{"id":"settings","label":"설정","group":"core"},{"id":"invite","label":"초대","group":"core"},{"id":"xp","label":"경험치","group":"core"},{"id":"level-up","label":"레벨 업","group":"core"},{"id":"bounty","label":"현상금","group":"core"},{"id":"guardian","label":"지역 수호자","group":"core"},{"id":"rumor","label":"소문","group":"workflow"},{"id":"archive","label":"아카이브","group":"workflow"},{"id":"joined","label":"합류·대기","group":"workflow"},{"id":"fighting","label":"전투 중","group":"workflow"},{"id":"done","label":"전투 완료","group":"workflow"},{"id":"retreated","label":"후퇴","group":"workflow"},{"id":"nominate","label":"지목","group":"workflow"},{"id":"accept","label":"수락","group":"workflow"},{"id":"pass","label":"패스","group":"workflow"},{"id":"relay","label":"토스","group":"workflow"},{"id":"reinforce","label":"증원","group":"workflow"},{"id":"witness","label":"나도 봤다","group":"workflow"},{"id":"investigate","label":"조사","group":"workflow"},{"id":"recheck","label":"재확인","group":"workflow"},{"id":"milestone","label":"이정표","group":"workflow"},{"id":"scout","label":"정찰","group":"workflow"},{"id":"add","label":"추가","group":"actions"},{"id":"remove","label":"제거","group":"actions"},{"id":"close","label":"닫기","group":"actions"},{"id":"edit","label":"수정","group":"actions"},{"id":"save","label":"저장","group":"actions"},{"id":"delete","label":"삭제","group":"actions"},{"id":"search","label":"검색","group":"actions"},{"id":"filter","label":"필터","group":"actions"},{"id":"sort-ascending","label":"오름차순","group":"actions"},{"id":"sort-descending","label":"내림차순","group":"actions"},{"id":"copy","label":"복사","group":"actions"},{"id":"download","label":"내보내기","group":"actions"},{"id":"upload","label":"업로드","group":"actions"},{"id":"refresh","label":"다시 시도","group":"actions"},{"id":"link","label":"링크·병합","group":"actions"},{"id":"external-link","label":"외부 링크","group":"actions"},{"id":"login","label":"로그인·입장","group":"systems"},{"id":"logout","label":"로그아웃·떠나기","group":"systems"},{"id":"lock","label":"잠금","group":"systems"},{"id":"key","label":"토큰·키","group":"systems"},{"id":"notification","label":"알림","group":"systems"},{"id":"chat","label":"주점·파티 채팅","group":"systems"},{"id":"mention","label":"멘션","group":"systems"},{"id":"attachment","label":"첨부","group":"systems"},{"id":"image","label":"이미지","group":"systems"},{"id":"video","label":"동영상","group":"systems"},{"id":"screen-record","label":"화면 녹화","group":"systems"},{"id":"floor","label":"층·서브태스크","group":"systems"},{"id":"realm","label":"환경·지역","group":"systems"},{"id":"help","label":"도움말","group":"systems"},{"id":"warning","label":"주의·오류","group":"systems"},{"id":"info","label":"정보","group":"systems"},{"id":"rank-f","label":"F 등급","group":"ranks"},{"id":"rank-e","label":"E 등급","group":"ranks"},{"id":"rank-d","label":"D 등급","group":"ranks"},{"id":"rank-c","label":"C 등급","group":"ranks"},{"id":"rank-b","label":"B 등급","group":"ranks"},{"id":"rank-a","label":"A 등급","group":"ranks"},{"id":"rank-s","label":"S 등급","group":"ranks"},{"id":"rank-none","label":"등급 없음","group":"ranks"},{"id":"intended","label":"의도된 연출","group":"ranks"},{"id":"mirage","label":"신기루","group":"ranks"},{"id":"merged","label":"병합됨","group":"ranks"},{"id":"vanished","label":"사라짐","group":"ranks"},{"id":"faded","label":"잠잠해짐","group":"ranks"},{"id":"dropped","label":"의뢰 취소","group":"ranks"},{"id":"pending","label":"대기 중","group":"ranks"},{"id":"success","label":"성공","group":"ranks"},{"id":"home","label":"홈","group":"navigation"},{"id":"arrow-left","label":"왼쪽·뒤로","group":"navigation"},{"id":"arrow-right","label":"오른쪽·다음","group":"navigation"},{"id":"arrow-up","label":"위로","group":"navigation"},{"id":"arrow-down","label":"아래로","group":"navigation"},{"id":"chevron-left","label":"이전","group":"navigation"},{"id":"chevron-right","label":"다음","group":"navigation"},{"id":"chevron-up","label":"접기","group":"navigation"},{"id":"chevron-down","label":"펼치기","group":"navigation"},{"id":"expand","label":"확대","group":"navigation"},{"id":"collapse","label":"축소","group":"navigation"},{"id":"more","label":"더 보기","group":"navigation"},{"id":"drag","label":"드래그","group":"navigation"},{"id":"calendar","label":"날짜","group":"navigation"},{"id":"clock","label":"시간","group":"navigation"},{"id":"empty","label":"비어 있음","group":"navigation"}],"categories":[{"id":"core","label":"길드·퀘스트"},{"id":"workflow","label":"공략·소문"},{"id":"actions","label":"편집·조작"},{"id":"systems","label":"계정·메시지·첨부"},{"id":"ranks","label":"등급·판정"},{"id":"navigation","label":"탐색·보조"}]};const sections=[];for(const group of data.categories){const option=document.createElement('option');option.value=group.id;option.textContent=group.label;document.querySelector('#category').append(option);const section=document.createElement('section');const title=document.createElement('h2');title.textContent=group.label;const grid=document.createElement('div');grid.className='grid';section.append(title,grid);document.querySelector('#content').append(section);const cards=[];for(const icon of data.records.filter(r=>r.group===group.id)){const card=document.createElement('article');card.className='card';const sprite=document.createElement('span');sprite.className='gl-icon gl-icon--'+icon.id;sprite.setAttribute('aria-hidden','true');const label=document.createElement('b');label.textContent=icon.label;const name=document.createElement('code');name.textContent=icon.id;const links=document.createElement('div');for(const size of [32,64]){const a=document.createElement('a');a.href=size+'/'+icon.id+'.png';a.textContent=size+'px';a.download=icon.id+'-'+size+'.png';links.append(a,document.createTextNode(' '));}card.append(sprite,label,name,links);grid.append(card);cards.push({card,icon});}sections.push({section,group,cards});}function filter(){const q=document.querySelector('#q').value.toLowerCase().trim(),category=document.querySelector('#category').value;for(const s of sections){let count=0;for(const {card,icon} of s.cards){const visible=(!category||category===s.group.id)&&(!q||(icon.id+' '+icon.label).toLowerCase().includes(q));card.classList.toggle('hidden',!visible);if(visible)count++;}s.section.classList.toggle('hidden',!count);}}document.querySelector('#q').oninput=filter;document.querySelector('#category').onchange=filter;document.querySelector('#size').onchange=e=>document.querySelectorAll('.gl-icon').forEach(el=>el.classList.toggle('gl-icon--2x',e.target.value==='64'));document.querySelector('#bg').onclick=e=>{const light=document.body.classList.toggle('light');e.target.textContent=light?'어두운 배경':'밝은 배경';};</script></html>
